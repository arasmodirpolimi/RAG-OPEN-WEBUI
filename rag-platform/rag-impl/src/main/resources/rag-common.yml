# Shared settings for rag-api and rag-ingestion. Every value can be overridden by an
# environment variable using Spring relaxed binding, e.g. rag.ollama.chat-model -> RAG_OLLAMA_CHAT_MODEL.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:rag}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

rag:
  collections: [contratti, normativa]
  opensearch:
    url: http://localhost:9200
    index-name: rag-chunks-v1
    index-alias: rag-chunks
    dimension: 1024            # must match the embedding model (bge-m3 = 1024)
    analyzer: italian
  ollama:
    url: http://localhost:11434
    embedding-model: bge-m3
    chat-model: qwen2.5:7b
    timeout: 5m
  llm:
    provider: ollama           # ollama | anthropic
  anthropic:
    url: https://api.anthropic.com
    api-key: ""
    model: claude-sonnet-5-5
    max-tokens: 1500
    timeout: 5m
  reranker:
    enabled: true
    url: http://localhost:8088
    min-score: 0.0             # 0 = disabled; calibrate on your golden question set
  retrieval:
    candidates-per-retriever: 50
    rerank-candidates: 30
    final-top-k: 6
    rrf-k: 60
  chunking:
    max-tokens: 400
    overlap-tokens: 50
    embedding-batch-size: 16
  docling:
    url: http://localhost:5001
    timeout: 15m
    ocr-languages: [it, en]
  storage:
    root: ./data/files
  queue:
    ingest: rag.ingest
    dead-letter: rag.ingest.dlq
  security:
    openai-api-key: ${RAG_OPENAI_API_KEY:change-me-openai}
    admin-api-key: ${RAG_ADMIN_API_KEY:change-me-admin}
  answer:
    model-prefix: "rag-"
    not-found-message: "Non ho trovato questa informazione nei documenti disponibili. / I could not find this information in the available documents."
